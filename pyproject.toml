[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-jack-in"
version = "0.1.0"
description = "Safely share Hermes Agent skills with Claude Code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sushiHex" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7"]
keywords = ["agent-skills", "claude-code", "hermes-agent", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Changelog = "https://github.com/sushiHex/hermes-jack-in/blob/main/CHANGELOG.md"
Documentation = "https://github.com/sushiHex/hermes-jack-in#readme"
Issues = "https://github.com/sushiHex/hermes-jack-in/issues"
Repository = "https://github.com/sushiHex/hermes-jack-in"

[project.scripts]
hermes-jack-in = "hermes_jack_in.cli:main"
hermes-jack-in-guard = "hermes_jack_in.guard:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_jack_in"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/CLAUDE.md",
]
include = [
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/build-constraints.txt",
    "/docs",
    "/overrides.example.yaml",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.3",
]
